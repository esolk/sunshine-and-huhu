<style>
/* Layout: one 16:9 picture-book stage centred on a night-sky ground; captions and controls float on the stage. */
:root{
  --night:#1b2757; --night-deep:#121a3f; --paper:#fff9f0; --ink:#4a3340;
  --pink:#f7a3c0; --pink-deep:#d9548a; --flame:#ff9a3c; --glow:#ffe27a;
  --display:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --text:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night-deep);color:var(--paper);font-family:var(--text);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:center;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage{position:relative;width:min(100%,calc((100vh - 24px) * 16 / 9));max-width:100%;aspect-ratio:16/9;
  background:var(--night);border-radius:calc(var(--u,10px) * 1.4);overflow:hidden;touch-action:none;
  box-shadow:0 0 0 calc(var(--u,10px) * .35) rgba(247,163,192,.35)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#cap{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);max-width:90%;width:max-content;white-space:pre-line;
  background:rgba(255,249,240,.9);color:var(--ink);border:calc(var(--u,10px) * .28) solid var(--pink);
  border-radius:calc(var(--u,10px) * 2.4);padding:calc(var(--u,10px) * 1.1) calc(var(--u,10px) * 2.6);
  font-size:calc(var(--u,10px) * 2.7);font-weight:500;line-height:1.45;text-align:center;text-wrap:balance;
  transition:opacity .25s;pointer-events:none}
#cap.hint{background:rgba(27,39,87,.86);color:var(--paper);border-color:var(--glow)}
#cap:empty{opacity:0}
#bar{position:absolute;top:2.5%;right:1.8%;display:flex;gap:calc(var(--u,10px) * .8)}
#bar button,.big{font-family:var(--display);cursor:pointer;border:0}
#bar button{width:calc(var(--u,10px) * 4.6);height:calc(var(--u,10px) * 4.6);border-radius:50%;

  display:flex;align-items:center;justify-content:center}
#bar button:hover{background:var(--paper)}
#bar button[aria-pressed="true"]{background:var(--pink)}
button:focus-visible{outline:calc(var(--u,10px) * .3) solid var(--glow);outline-offset:2px}
#cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:calc(var(--u,10px) * 1.4);padding-bottom:6%;padding-left:34%}
.big{background:var(--pink-deep);color:#fff;font-size:calc(var(--u,10px) * 3.6);
  padding:calc(var(--u,10px) * 1.3) calc(var(--u,10px) * 4.4);border-radius:calc(var(--u,10px) * 4);
  box-shadow:0 calc(var(--u,10px) * .5) 0 #a83a68}
.big:active{transform:translateY(calc(var(--u,10px) * .3));box-shadow:0 calc(var(--u,10px) * .2) 0 #a83a68}
#how{font-size:calc(var(--u,10px) * 1.9);color:var(--ink);background:rgba(255,249,240,.82);
  padding:calc(var(--u,10px) * .6) calc(var(--u,10px) * 1.8);border-radius:calc(var(--u,10px) * 2)}
#turn{position:fixed;inset:0;background:var(--night-deep);display:none;align-items:center;justify-content:center;
  text-align:center;font-family:var(--display);font-size:22px;padding:24px;z-index:5}
@media (orientation:portrait) and (max-width:600px){#turn{display:flex}}
</style>

<div id="stage">
  <canvas id="cv" aria-label="绘本画面"></canvas>
  <div id="cap" aria-live="polite"></div>
  <div id="bar" hidden>
    <button id="b-prev" title="上一段" aria-label="上一段">◀</button>
    <button id="b-pause" title="暂停" aria-label="暂停或继续" aria-pressed="false">Ⅱ</button>
    <button id="b-next" title="下一段" aria-label="下一段">▶</button>
    <button id="b-music" title="音乐" aria-label="音乐开关" aria-pressed="false">♪</button>
  </div>
  <div id="cover">
    <button class="big" id="b-start">开始讲故事</button>
    <div id="how">按住屏幕是大火，轻轻点是小火</div>
  </div>
</div>
<div id="turn">把手机横过来，<br>故事就开始啦</div>

  ctx.fillStyle = g; ctx.fillRect(x - w/2, y0 + h * (1 - f), w, h * f);
  ctx.restore();
  if(zone){
    const a = y0 + h * (1 - zone[1]), b = y0 + h * (1 - zone[0]);
    ctx.lineWidth = 9; ctx.strokeStyle = `rgba(255,255,255,${.7 + .3 * Math.sin(t * 5)})`;
    rr(x - w/2 - 16, a, w + 32, b - a, 22); ctx.stroke();
    const inz = f >= zone[0] && f <= zone[1];
    ctx.lineWidth = 5; ctx.strokeStyle = inz ? '#7be08f' : '#f7a3c0';
    rr(x - w/2 - 16, a, w + 32, b - a, 22); ctx.stroke();
  }
  ctx.font = '700 40px ' + getComputedStyle(document.body).fontFamily; ctx.textAlign = 'center';
  ctx.fillStyle = '#fff9f0'; ctx.strokeStyle = 'rgba(27,39,87,.7)'; ctx.lineWidth = 8; ctx.lineJoin = 'round';
  ctx.strokeText('大', x, y0 - 28); ctx.fillText('大', x, y0 - 28);
  ctx.strokeText('小', x, y0 + h + 62); ctx.fillText('小', x, y0 + h + 62);
  if(prog != null){
    ctx.lineWidth = 16; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,249,240,.45)'; ctx.beginPath(); ctx.arc(x + 130, y0 + 40, 44, 0, 7); ctx.stroke();
    ctx.strokeStyle = '#ffe27a'; ctx.beginPath();
    ctx.arc(x + 130, y0 + 40, 44, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, prog)); ctx.stroke();
    star(x + 130, y0 + 40, 20, '#ffe27a');
  }
  ctx.restore();
}
function rr(x, y, w, h, r){ r = Math.min(r, w/2, h/2); ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function star(x, y, R, col){
  ctx.beginPath();
  for(let i = 0; i < 10; i++){ const a = -Math.PI/2 + i * Math.PI/5, r = i % 2 ? R * .5 : R; ctx.lineTo(x + r * Math.cos(a), y + r * Math.sin(a)); }
  ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}
const ease = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
const now = () => performance.now() / 1000;
function deferred(){ let r; const p = new Promise(x => r = x); return [p, r]; }

// a "keep the flame inside the zone" tracker shared by several games
function zoneTimer(zone, need){
  return {zone, need, acc: 0,
    step(dt){ const inz = fire.f >= zone[0] && fire.f <= zone[1];
      this.acc = inz ? this.acc + dt : Math.max(0, this.acc - dt * .5); return this.acc >= need; },
    get p(){ return this.acc / need; }};
}
let lastNag = 0;
function nag(k){ if(now() - lastNag > 6 && !voiceBusy()){ lastNag = now(); say(k || 'r_toobig'); cap.classList.add('hint'); } }

// ---------------------------------------------------------------- games
const ASSETS = {
  big: ['bg_s2b', 'flameR'], run: ['bg_s3a', 'stand', 'runner'], paint: ['bg_s3b', 'rainbow'],
  inflate: ['bg_s7b', 'bal_big', 'bal_small'], cloud: ['bg_s10a', 'flame10', 'sflame10'],
  fly: ['bg_fly', 'peak', 'pines', 'cloudS', 'starC', 'bal_big5', 'bal_small5'],
  fruit: ['bg_s13a', 'stardim', 'starlit', 'flameL'],
  tree: ['bg_s14', 'g14', 'sh14', 'dr14', ...Array.from({length: 12}, (_, i) => 'lit' + i)],
  breath: ['bg_s15b', 'firebehind', 'girl_teary', 'girl_cry', 'girl_blow', 'girl_calm', 'sheep15', 'drag16', 'sflame16', 'puff'],
  bed: ['bg_s18a', 'bg_s18a_lit'],
};
const flick = () => 1 + .045 * Math.sin(now() * 11) + .03 * Math.sin(now() * 17 + 1);

const GAMES = {
  big(){
    const [done, fin] = deferred(); let phase = 0, zt = zoneTimer([.72, 1], 1.0), roared = false;
    return {done, update(dt){
      if(phase > 1) return;
      if(phase === 0 && fire.f > .72 && !roared){ roared = true; fx('fx_big'); }
      if(zt.step(dt)){
        if(phase === 0){ phase = 1; zt = zoneTimer([.1, .36], 2.0); say('p_small'); cap.classList.add('hint'); }
        else { phase = 2; fx('fx_chime'); fin(); }
      }
    }, draw(){
      bg('bg_s2b'); spr('flameR', {s: (.1 + .9 * fire.f) * flick(), a: fire.f * 6});
      gauge(phase < 2 ? zt.zone : null, zt.p);
    }};
  },
  fill(kind){
    const [done, fin] = deferred(); let p = 0, roared = false, fint = 0, over = false;
    return {done, update(dt){
      if(over){ fint += dt; return; }
      if(fire.f >= .6){ p += dt / 3.2; if(!roared){ roared = true; fx('fx_big'); } }
      if(p >= 1){ p = 1; over = true; fx(kind === 'paint' ? 'fx_chime2' : 'fx_chime'); fin(); }
    }, draw(){
      if(kind === 'run'){
        bg('bg_s3a');
        if(p < .01 && fire.f < .6) spr('stand');
        else spr('runner', {x: M.sprites.runner.x + 880 * ease(p), y: M.sprites.runner.y - Math.abs(Math.sin(now() * 9)) * 16 * (over ? 0 : 1)});
      } else if(kind === 'paint'){
        bg('bg_s3b'); spr('rainbow', {clip: ease(p)});
      } else {
        bg('bg_s7b');
        spr(fire.pressed || over ? 'bal_big' : 'bal_small', {s: .42 + .58 * ease(p), y: 880 - ease(fint / 6) * 520 + 5 * Math.sin(now() * 2), rot: 2 * Math.sin(now() * 1.3)});
      }
      if(!over) gauge([.6, 1], p);
    }};
  },
  run(){ return GAMES.fill('run'); }, paint(){ return GAMES.fill('paint'); }, inflate(){ return GAMES.fill('inflate'); },
  cloud(){
    const [done, fin] = deferred(); const zt = zoneTimer([.1, .36], 3.0); let over = false, hot = 0;
    return {done, start(){ fire.f = .95; }, update(dt){
      if(over) return;
      hot = fire.f > .62 ? hot + dt : 0; if(hot > 1.2) nag();
      if(zt.step(dt)){ over = true; fx('fx_chime'); fin(); }
    }, draw(){
      bg('bg_s10a');
      if(over) spr('sflame10', {s: flick()}); else spr('flame10', {s: (.12 + .88 * fire.f) * flick(), a: fire.f * 8});
      ctx.fillStyle = `rgba(255,255,255,${over ? 0 : .5 * (1 - zt.p) + .12 * Math.max(0, fire.f - .5)})`; ctx.fillRect(0, 0, W, H);
      if(!over) gauge(zt.zone, zt.p);
    }};
  },
  fly(){
    const [done, fin] = deferred();
    const KP = [[0,600],[900,600],[1800,350],[2700,600],[3300,590],[4300,590],[4800,520],[5500,350],[6300,600],[6800,590],[7500,590],[8300,520]];
    const ideal = x => { for(let i = 1; i < KP.length; i++) if(x <= KP[i][0]){ const a = KP[i-1], b = KP[i]; return a[1] + (b[1] - a[1]) * ease((x - a[0]) / (b[0] - a[0])); } return 520; };
    const peaks = [1800, 5500], woods = [[3200, 4400], [6700, 7600]], BX = 520, END = 8300;
    const stars = []; for(let x = 760; x < END - 200; x += 230) stars.push({x, y: ideal(x) - 175, got: 0});
    const cues = [[1800 - 800, 'v_big', '“呼呼，大火！”'], [3200 - 700, 'v_small', '“呼呼，小火。”'], [5500 - 800, 'v_big', '“呼呼，大火！”'], [6700 - 700, 'v_small', '“呼呼，小火。”']];
    let sx = 0, y = 600, n = 0, bump = 0, over = false, going = false;
    return {done, start(){ fire.f = .42; going = true; }, update(dt){
      if(!going || over) return;
      sx += 270 * dt; const wx = sx + BX;
      let ty = 820 - fire.f * 520, floor = 900;
      for(const px of peaks){ const d = Math.abs(wx - px); if(d < 470) floor = Math.min(floor, 460 + d * 540 / 470 - 8); }
      for(const [a, b] of woods) if(wx > a - 120 && wx < b + 120) floor = Math.min(floor, 668);
      y += (ty - y) * Math.min(1, dt * 3);
      if(y > floor){ y = floor; if(now() - bump > .9){ bump = now(); fx('fx_bump', .6); } }
      for(const s of stars) if(!s.got && Math.hypot(s.x - wx, s.y - (y - 175)) < 125){ s.got = now(); n++; fx('fx_pop', .7); }
      while(cues.length && wx > cues[0][0]){ const c = cues.shift(); voice(c[1]); caption(c[2]); }
      if(sx > END - BX){ over = true; say('r_fly'); fin(); }
    }, draw(){
      bg('bg_fly');
      for(let i = 0; i < 6; i++){ const cx = ((i * 700 - sx * .35) % 4200 + 4200) % 4200 - 300; spr('cloudS', {x: cx, y: 170 + (i * 137) % 260, a: .8}); }
      for(const px of peaks) if(Math.abs(px - sx - 960) < 1500) spr('peak', {x: px - sx, y: 1000});
      for(const [a, b] of woods) for(let x = a; x <= b; x += 210) if(Math.abs(x - sx - 960) < 1300) spr('pines', {x: x - sx, y: 1012});
      for(const s of stars){
        const X = s.x - sx; if(X < -100 || X > W + 100) continue;
        if(!s.got) spr('starC', {x: X, y: s.y + 6 * Math.sin(now() * 3 + s.x), s: .9});
        else if(now() - s.got < .4) spr('starC', {x: X, y: s.y - (now() - s.got) * 200, s: .9 + (now() - s.got) * 2, a: 1 - (now() - s.got) / .4});
      }
      const sh = now() - bump < .3 ? 6 * Math.sin(now() * 60) : 0;
      spr(fire.pressed ? 'bal_big5' : 'bal_small5', {x: BX + sh, y: y + 4 * Math.sin(now() * 2), rot: 3 * Math.sin(now() * 1.4)});
      ctx.fillStyle = 'rgba(27,39,87,.6)'; rr(W - 330, 150, 250, 86, 43); ctx.fill();
      star(W - 280, 193, 26, '#ffe27a');
      ctx.fillStyle = '#fff9f0'; ctx.font = '700 48px ' + getComputedStyle(document.body).fontFamily; ctx.textAlign = 'left';
      ctx.fillText('× ' + n, W - 240, 210);
      if(!over) gauge(null, null);
    }};
  },
  fruit(){
    const [done, fin] = deferred(); const zt = zoneTimer([.08, .32], 2.2); let hide = 0, over = false, litT = 0, first = true;
    const st = M.sprites.stardim;
    return {done, update(dt){
      if(over){ litT += dt; return; }
      if(hide > 0){ hide -= dt; fire.f = 0; return; }
      if(fire.f > .58){ hide = 1.9; zt.acc = 0; fx('fx_whoosh', .5); if(first){ first = false; lastNag = now(); say('v_hide'); cap.classList.add('hint'); } else nag(); return; }
      if(zt.step(dt)){ over = true; fx('fx_chime'); fin(); }
    }, draw(){
      bg('bg_s13a');
      const g = hide > 0 ? ease(Math.min(1, (1.9 - hide) / .3)) * ease(Math.min(1, hide / .4)) : 0;
      spr('stardim', {s: 1 - .9 * g, y: st.y - g * 420, a: 1 - g});
      spr('starlit', {a: over ? ease(litT / 1.2) : .6 * zt.p, s: 1 + .05 * Math.sin(now() * 2.4)});
      if(!over) spr('flameL', {s: (.08 + .92 * fire.f) * flick(), a: fire.f * 10});
      else spr('flameL', {s: .1 * flick()});
      if(!over) gauge(zt.zone, zt.p);
    }};
  },
  tree(){
    const [done, fin] = deferred(); let zt = zoneTimer([.08, .32], 1.3), lit = 0, over = false; const at = [];
    return {done, update(dt){
      if(over) return;
      if(fire.f > .58){ zt.acc = 0; nag(); }
      if(zt.step(dt)){
        for(let i = 0; i < 4; i++) at[lit + i] = now() + i * .12;
        lit += 4; fx(lit >= 12 ? 'fx_chime2' : 'fx_chime'); fire.f = 0; zt = zoneTimer([.08, .32], 1.3);
        if(lit >= 12){ over = true; fin(); }
      }
    }, draw(){
      bg('bg_s14');
      for(let i = 0; i < 12; i++) if(at[i] != null){ const u = now() - at[i]; if(u > 0) spr('lit' + i, {a: ease(u / .5), s: 1 + .3 * Math.max(0, Math.sin(Math.min(1, u / .6) * Math.PI)) + .05 * Math.sin(now() * 2.5 + i)}); }
      const hop = over ? 1 : .25;
      spr('g14', {y: M.sprites.g14.y - Math.abs(Math.sin(now() * 4)) * 22 * hop});
      spr('sh14', {y: M.sprites.sh14.y - Math.abs(Math.sin(now() * 4 + 1.2)) * 26 * hop});
      spr('dr14', {x: 960 + 330 * Math.cos(now() * 1.3), y: 660 + 50 * Math.sin(now() * 2.6)});
      if(!over) gauge(zt.zone, zt.p);
    }};
  },
  breath(){
    const [done, fin] = deferred(); let heat = 3, shown = 3, h = 0, ex = 0, exFrom = 0, over = false, endT = 0, toldIn = 0, toldOut = 0; const puffs = [];
    return {done, update(dt){
      shown += (heat - shown) * Math.min(1, dt * 2);
      if(over){ endT += dt; return; }
      if(ex > 0){
        ex -= dt;
        if(ex <= 0){ heat--; h = 0; puffs.push(now()); fx('fx_pop', .5);
          if(heat <= 0){ over = true; fx('fx_chime2'); caption(''); fin(); } else caption('再来一次：按住，吸气……', true); }
        return;
      }
      if(fire.pressed){ if(h === 0 && toldIn++ < 2){ voice('r_in'); } if(h === 0) caption('吸气……', true); h = Math.min(3, h + dt); }
      else if(h >= 1.6){ ex = 3.2; exFrom = h; fx('fx_soft', 1); if(toldOut++ < 2) voice('r_out'); caption('慢慢吹——', true); }
      else if(h > 0){ h = Math.max(0, h - dt * 2); if(h === 0) caption('按住久一点，吸一大口气', true); }
    }, draw(){
      bg('bg_s15b');
      const k = Math.max(0, shown / 3);
      spr('firebehind', {s: (.3 + .7 * k) * (1 + .03 * Math.sin(now() * 9)), a: Math.min(1, k * 3) * .92});
      spr(over ? 'girl_calm' : ex > 0 ? 'girl_blow' : heat >= 3 ? 'girl_cry' : 'girl_teary');
      spr('sheep15', {y: M.sprites.sheep15.y + 3 * Math.sin(now() * 2)});
      for(const t0 of puffs){ const u = now() - t0; if(u < 6) spr('puff', {x: 885 + 10 * Math.sin(u * 1.4), y: 640 - Math.min(u * 60, 330), s: .3 + .9 * ease(u / .6), a: 1 - ease((u - 4) / 2)}); }
      if(over){ spr('drag16', {y: M.sprites.drag16.y + 6 * Math.sin(now() * 2.4), a: ease(endT)}); spr('sflame16', {y: M.sprites.sflame16.y + 6 * Math.sin(now() * 2.4), a: ease(endT), s: flick()}); return; }
      // breathing ring
      const cx = 1250, cy = 400, r = ex > 0 ? 50 + 150 * (exFrom / 3) * (ex / 3.2) : 50 + 150 * (h / 3);
      ctx.save();
      ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(255,249,240,.75)'; ctx.setLineDash([6, 22]); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(cx, cy, 200, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = ex > 0 ? 'rgba(190,225,255,.8)' : 'rgba(255,226,122,.8)'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
      ctx.lineWidth = 8; ctx.strokeStyle = '#fff9f0'; ctx.stroke();
      for(let i = 0; i < 3; i++) star(cx - 70 + i * 70, cy + 262, 22, i < 3 - heat ? '#ffe27a' : 'rgba(255,249,240,.45)');
      ctx.restore();
    }};
  },
  bed(){
    const [done, fin] = deferred(); const zt = zoneTimer([.06, .3], .9); let over = false, t = 0;
    return {done, update(dt){
      if(over){ t += dt; return; }
      if(fire.f > .55){ fire.f = 0; zt.acc = 0; nag(); }
      if(zt.step(dt)){ over = true; fx('fx_chime'); fin(); }
    }, draw(){
      bg('bg_s18a');
      const i = img('bg_s18a_lit'); if(ok(i)){ ctx.globalAlpha = over ? ease(t / 1.4) : .4 * zt.p; ctx.drawImage(i, 0, 0, W, H); ctx.globalAlpha = 1; }
      if(!over) gauge(zt.zone, zt.p);
    }};
  },
};

// ---------------------------------------------------------------- loop
let last = performance.now();
function frame(t){
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  if(!paused){
    stepT += dt;
    for(const w of waits){ w.ms -= dt * 1000; if(w.ms <= 0) w.res(); }
    waits = waits.filter(w => w.ms > 0);
    if(game){
      if(fire.on) fire.f = Math.max(0, Math.min(1, fire.f + (fire.pressed ? .7 : -.55) * dt));
      game.update(dt);
    }
    if(page && page.fade < 1) page.fade = Math.min(1, page.fade + dt / .6);
  }
  ctx.setTransform(cv.width / W, 0, 0, cv.width / W, 0, 0);
  ctx.fillStyle = '#1b2757'; ctx.fillRect(0, 0, W, H);
  if(game) game.draw();
  else if(page){
    const z = 1 + .045 * Math.min(1, stepT / 18);
    if(page.prev && page.fade < 1) bg(page.prev, z);
    ctx.globalAlpha = ease(page.fade); bg(page.cur, z); ctx.globalAlpha = 1;
  }
  requestAnimationFrame(frame);
}

function fit(){
  const r = stage.getBoundingClientRect();
  stage.style.setProperty('--u', (r.width / 100) + 'px');
  const w = Math.round(Math.min(1920, r.width * Math.min(2, window.devicePixelRatio || 1)));
  if(cv.width !== w){ cv.width = w; cv.height = Math.round(w * 9 / 16); }
}
addEventListener('resize', fit); fit();

// ---------------------------------------------------------------- input
const isUI = e => e.target.closest && e.target.closest('button');
stage.addEventListener('pointerdown', e => { if(isUI(e)) return; fire.pressed = true; e.preventDefault(); });
for(const ev of ['pointerup', 'pointercancel', 'pointerleave']) addEventListener(ev, () => { fire.pressed = false; });
addEventListener('blur', () => { fire.pressed = false; });
addEventListener('keydown', e => { if(e.code === 'Space' && !e.target.closest('button')){ fire.pressed = true; e.preventDefault(); } });
addEventListener('keyup', e => { if(e.code === 'Space') fire.pressed = false; });
stage.addEventListener('contextmenu', e => e.preventDefault());

$('b-start').onclick = async () => {
  if(!started){ unlock(); started = true; }
  $('bar').hidden = false; $('cover').hidden = true;
  if(STEPS[cur].type === 'end'){ go(1); return; }
  const tok = token;
  await voice('v_title'); if(tok !== token) return;
  await wait(500); if(tok === token) go(1);
};
$('b-prev').onclick = () => go(cur - 1);
$('b-next').onclick = () => go(cur + 1);
$('b-pause').onclick = () => {
  paused = !paused; $('b-pause').setAttribute('aria-pressed', paused); $('b-pause').textContent = paused ? '▶' : 'Ⅱ';
  if(paused){ voiceEl.pause(); musicEl.pause(); }
  else { if(voiceDone && voiceEl.currentTime > 0 && !voiceEl.ended){ const p = voiceEl.play(); if(p) p.catch(() => {}); } if(musicOn){ const p = musicEl.play(); if(p) p.catch(() => {}); } }
};
$('b-music').onclick = () => {
  musicOn = !musicOn; $('b-music').setAttribute('aria-pressed', !musicOn);
  if(musicOn){ const p = musicEl.play(); if(p) p.catch(() => {}); } else musicEl.pause();
};
document.addEventListener('visibilitychange', () => { if(document.hidden && !paused) $('b-pause').onclick(); });

window.__book = {go, get cur(){ return cur; }, fire, STEPS, get game(){ return game; }};
img('s_title_0'); go(0); requestAnimationFrame(frame);
</script>
</body></html>
