<!doctype html><html lang="zh-CN"><head><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>Sunshine和小火龙呼呼 纸偶版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: one 16:9 paper-theatre stage on a kraft-paper ground; captions and controls float on the stage. */
:root{
  --kraft:#c9a57a; --kraft-deep:#a98258; --paper:#fffaf0; --ink:#3a2a33; --pink:#f39ab8; --pink-deep:#de5c8c; --glow:#ffe27a;
  --display:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --text:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--kraft);background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.4px);background-size:7px 7px;
  color:var(--ink);font-family:var(--text);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage{position:relative;width:min(100%,calc((100vh - 24px) * 16 / 9));max-width:100%;aspect-ratio:16/9;background:var(--paper);
  border-radius:calc(var(--u,10px) * 1.2);overflow:hidden;touch-action:none;
  box-shadow:0 calc(var(--u,10px) * .5) calc(var(--u,10px) * 1.4) rgba(70,40,20,.35),0 0 0 calc(var(--u,10px) * .5) var(--paper)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#cap{position:absolute;left:50%;bottom:3.5%;transform:translateX(-50%);max-width:74%;width:max-content;white-space:pre-line;
  background:var(--paper);color:var(--ink);border-radius:calc(var(--u,10px) * 1.2);
  padding:calc(var(--u,10px) * .9) calc(var(--u,10px) * 2.4);font-size:calc(var(--u,10px) * 2.5);font-weight:500;line-height:1.45;
  text-align:center;box-shadow:calc(var(--u,10px) * .3) calc(var(--u,10px) * .5) 0 rgba(70,40,60,.28);transition:opacity .2s;pointer-events:none;
  rotate:-.6deg}
#cap.hint{background:var(--glow)}
#cap:empty{opacity:0}
button{font-family:var(--display);cursor:pointer;border:0;color:var(--ink)}
button:focus-visible{outline:calc(var(--u,10px) * .3) solid var(--pink-deep);outline-offset:2px}
#bar{position:absolute;top:2.5%;right:1.8%;display:flex;gap:calc(var(--u,10px) * .8)}
#bar button{width:calc(var(--u,10px) * 4.6);height:calc(var(--u,10px) * 4.6);border-radius:50%;background:var(--paper);
  font-size:calc(var(--u,10px) * 2);line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:calc(var(--u,10px) * .2) calc(var(--u,10px) * .35) 0 rgba(70,40,60,.28)}
#bar button[aria-pressed="true"]{background:var(--pink)}
#walk button{position:absolute;bottom:4%;width:calc(var(--u,10px) * 9);height:calc(var(--u,10px) * 9);border-radius:50%;
  background:var(--paper);font-size:calc(var(--u,10px) * 4.4);box-shadow:calc(var(--u,10px) * .3) calc(var(--u,10px) * .6) 0 rgba(70,40,60,.3)}
#walk button:active{translate:0 calc(var(--u,10px) * .3);box-shadow:calc(var(--u,10px) * .1) calc(var(--u,10px) * .2) 0 rgba(70,40,60,.3)}
#w-left{left:2.5%} #w-right{right:2.5%}
#cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:calc(var(--u,10px) * 1.4);padding-bottom:6%;padding-left:24%}
.big{background:var(--pink-deep);color:#fff;font-size:calc(var(--u,10px) * 3.8);padding:calc(var(--u,10px) * 1.3) calc(var(--u,10px) * 4.4);
  border-radius:calc(var(--u,10px) * 1.4);rotate:-1.5deg;box-shadow:calc(var(--u,10px) * .4) calc(var(--u,10px) * .7) 0 rgba(120,30,70,.45)}
.big:active{translate:0 calc(var(--u,10px) * .3)}
#how{font-size:calc(var(--u,10px) * 2);background:var(--paper);padding:calc(var(--u,10px) * .6) calc(var(--u,10px) * 1.8);
  border-radius:calc(var(--u,10px) * .8);rotate:.8deg;box-shadow:calc(var(--u,10px) * .2) calc(var(--u,10px) * .4) 0 rgba(70,40,60,.25)}
#turn{position:fixed;inset:0;background:var(--kraft);display:none;align-items:center;justify-content:center;text-align:center;
  font-family:var(--display);font-size:22px;padding:24px;z-index:5}
@media (orientation:portrait) and (max-width:600px){#turn{display:flex}}
</style>

<div id="stage">
  <canvas id="cv" aria-label="纸偶绘本画面"></canvas>
  <div id="cap" aria-live="polite"></div>
  <div id="walk" hidden>
    <button id="w-left" aria-label="向左走">◀</button>
    <button id="w-right" aria-label="向右走">▶</button>
  </div>
  <div id="bar" hidden>
    <button id="b-pause" title="暂停" aria-label="暂停或继续" aria-pressed="false">Ⅱ</button>
    <button id="b-skip" title="跳过这句话" aria-label="跳过这句话">»</button>
    <button id="b-next" title="下一个场景" aria-label="下一个场景">⇥</button>
    <button id="b-music" title="音乐" aria-label="音乐开关" aria-pressed="false">♪</button>
  </div>
  <div id="cover">
    <button class="big" id="b-start">开始</button>
    <div id="how">点地面走路，点星星说话和玩</div>
  </div>
</div>
<div id="turn">把手机横过来，<br>故事就开始啦</div>

<script>
// ---------------------------------------------------------------- paper-collage drawing engine
// Every shape is a piece of cut paper: slightly wobbly edge that is re-cut every few frames ("boil"),
// a soft drop shadow, paper grain, optionally a torn white rim or a printed pattern.
const W = 1920, H = 1080;
let ctx = null, K = 1, BOIL = 0, SEED = 0;
const INK = '#3a2a33', RIM = '#fffaf0';

function hash(a, b, c){
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const seed = n => { SEED = n * 1000; };
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };

// ---- shape builders (arrays of [x, y])
function E(cx, cy, rx, ry, n){
  n = n || Math.max(10, Math.min(40, Math.round((rx + ry) / 5)));
  const p = [];
  for(let i = 0; i < n; i++){ const a = i / n * Math.PI * 2; p.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); }
  return p;
}
function S(pts, k){
  k = k || 6; const n = pts.length, out = [];
  for(let i = 0; i < n; i++){
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    for(let j = 0; j < k; j++){
      const t = j / k, t2 = t * t, t3 = t2 * t;
      out.push([.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
                .5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]);
    }
  }
  return out;
}
function So(pts, k){   // open smooth curve
  k = k || 6; const n = pts.length, out = [];
  for(let i = 0; i < n - 1; i++){
    const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, n - 1)];
    for(let j = 0; j < k; j++){
      const t = j / k, t2 = t * t, t3 = t2 * t;
      out.push([.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
                .5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]);
    }
  }
  out.push(pts[n - 1]); return out;
}
function RR(x, y, w, h, r){
  r = Math.min(r || 0, w / 2, h / 2); const p = [], c = [[x + w - r, y + r, -90], [x + w - r, y + h - r, 0], [x + r, y + h - r, 90], [x + r, y + r, 180]];
  for(const [cx, cy, a0] of c) for(let i = 0; i <= 4; i++){ const a = (a0 + i * 22.5) * Math.PI / 180; p.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  return p;
}
function STAR(cx, cy, R, r, n, rot){
  n = n || 5; r = r || R * .5; const p = [];
  for(let i = 0; i < n * 2; i++){ const a = (rot || -90) * Math.PI / 180 + i * Math.PI / n, q = i % 2 ? r : R; p.push([cx + q * Math.cos(a), cy + q * Math.sin(a)]); }
  return p;
}
function HEART(cx, cy, s){
  const p = [];
  for(let i = 0; i < 28; i++){ const t = i / 28 * Math.PI * 2; p.push([cx + s * Math.pow(Math.sin(t), 3), cy - s * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16]); }
  return p;
}
function strip(pts, w){   // fat polyline -> polygon (for tails, ribbons)
  const L = [], Rr = [];
  for(let i = 0; i < pts.length; i++){
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let nx = -(b[1] - a[1]), ny = b[0] - a[0]; const d = Math.hypot(nx, ny) || 1; nx /= d; ny /= d;
    const ww = (typeof w === 'function' ? w(i / (pts.length - 1)) : w) / 2;
    L.push([pts[i][0] + nx * ww, pts[i][1] + ny * ww]); Rr.unshift([pts[i][0] - nx * ww, pts[i][1] - ny * ww]);
  }
  return L.concat(Rr);
}

// ---- papers
let GRAIN = null; const PATS = {};
function makePapers(){
  const mk = (n, f) => { const c = document.createElement('canvas'); c.width = c.height = n; f(c.getContext('2d'), n); return ctx.createPattern(c, 'repeat'); };
  GRAIN = mk(256, (g, n) => {
    g.fillStyle = '#fff'; g.fillRect(0, 0, n, n);
    for(let i = 0; i < 5200; i++){ const v = 150 + hash(i, 1, 7) * 90 | 0; g.fillStyle = `rgba(${v},${v - 6},${v - 14},${.10 + hash(i, 2, 7) * .22})`; g.fillRect(hash(i, 3, 7) * n, hash(i, 4, 7) * n, 1 + hash(i, 5, 7) * 1.6, 1 + hash(i, 6, 7) * 1.6); }
    g.lineWidth = .8;
    for(let i = 0; i < 90; i++){ const x = hash(i, 1, 9) * n, y = hash(i, 2, 9) * n, a = hash(i, 3, 9) * 6.28, l = 6 + hash(i, 4, 9) * 16;
      g.strokeStyle = `rgba(120,100,90,${.08 + hash(i, 5, 9) * .12})`; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * .5 + 3, y + Math.sin(a) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  });
  PATS.dots = mk(44, (g, n) => { g.fillStyle = 'rgba(255,255,255,.55)'; for(const [x, y] of [[11, 11], [33, 33]]){ g.beginPath(); g.arc(x, y, 5, 0, 7); g.fill(); } });
  PATS.stripes = mk(36, (g, n) => { g.strokeStyle = 'rgba(255,255,255,.34)'; g.lineWidth = 7; for(let i = -1; i < 3; i++){ g.beginPath(); g.moveTo(i * 36, 36); g.lineTo(i * 36 + 36, 0); g.stroke(); } });
  PATS.grid = mk(40, (g, n) => { g.strokeStyle = 'rgba(255,255,255,.3)'; g.lineWidth = 3; g.strokeRect(0, 0, n, n); });
  PATS.dark = mk(40, (g, n) => { g.fillStyle = 'rgba(30,20,60,.16)'; for(const [x, y] of [[10, 10], [30, 30]]){ g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill(); } });
  PATS.scale = mk(48, (g, n) => { g.strokeStyle = 'rgba(255,255,255,.4)'; g.lineWidth = 3; for(const [x, y] of [[0, 0], [48, 0], [24, 24], [0, 48], [48, 48]]){ g.beginPath(); g.arc(x, y, 22, .15, Math.PI - .15); g.stroke(); } });
}

function jpath(pts, s, jit, open){
  const p = new Path2D(), b = BOIL;
  for(let i = 0; i < pts.length; i++){
    const x = pts[i][0] + (hash(s, i, b) - .5) * 2 * jit, y = pts[i][1] + (hash(s, i + 7919, b) - .5) * 2 * jit;
    i ? p.lineTo(x, y) : p.moveTo(x, y);
  }
  if(!open) p.closePath();
  return p;
}
// cut(points, colour, {jit, sh, rim, pat, a, grain})
function cut(pts, fill, o){
  o = o || {}; const s = SEED++, path = jpath(pts, s, o.jit ?? 1.5);
  ctx.save();
  if(o.a != null) ctx.globalAlpha *= o.a;
  const sh = o.sh ?? 1;
  if(sh > 0){ ctx.shadowColor = 'rgba(46,24,60,.30)'; ctx.shadowBlur = 9 * sh * K; ctx.shadowOffsetX = 3 * sh * K; ctx.shadowOffsetY = 5 * sh * K; }
  if(o.rim){ ctx.lineJoin = 'round'; ctx.lineWidth = o.rim * 2; ctx.strokeStyle = RIM; ctx.stroke(path); ctx.shadowColor = 'transparent'; }
  ctx.fillStyle = fill; ctx.fill(path);
  ctx.shadowColor = 'transparent';
  if(o.pat){ ctx.fillStyle = PATS[o.pat]; ctx.fill(path); }
  if(o.grain !== 0 && GRAIN){
    ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha *= (o.grain ?? .55);
    try { GRAIN.setTransform(new DOMMatrix().translateSelf((s * 37) % 256, (s * 91) % 256)); } catch(e){}
    ctx.fillStyle = GRAIN; ctx.fill(path);
  }
  ctx.restore();
}
// a drawn crayon / pencil line
function ink(pts, w, col, o){
  o = o || {}; const s = SEED++, path = jpath(pts, s, o.jit ?? 1.1, !o.closed);
  ctx.save(); if(o.a != null) ctx.globalAlpha *= o.a;
  ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = col || INK; ctx.stroke(path); ctx.restore();
}
function dot(x, y, r, col){ cut(E(x, y, r, r, 8), col || INK, {sh: 0, jit: .5, grain: 0}); }
function arc(cx, cy, r, a0, a1, ry, n){
  const p = []; n = n || 7;
  for(let i = 0; i <= n; i++){ const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; p.push([cx + r * Math.cos(a), cy + (ry || r) * Math.sin(a)]); }
  return p;
}
function at(x, y, rot, sx, sy, fn){
  ctx.save(); ctx.translate(x, y); if(rot) ctx.rotate(rot * Math.PI / 180);
  if(sx != null && (sx !== 1 || (sy ?? sx) !== 1)) ctx.scale(sx, sy ?? sx);
  fn(); ctx.restore();
}
function label(txt, x, y, size, col, o){
  o = o || {};
  ctx.save(); ctx.font = `${o.w || 400} ${size}px ${o.font || '"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif'}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if(o.stroke){ ctx.lineWidth = o.sw || 8; ctx.lineJoin = 'round'; ctx.strokeStyle = o.stroke; ctx.strokeText(txt, x, y); }
  ctx.fillStyle = col; ctx.fillText(txt, x, y); ctx.restore();
}

// ---------------------------------------------------------------- cut-out puppets
const SKIN = '#f8dcc7', HAIR = '#2e2226', PINK = '#f39ab8', DPINK = '#de5c8c', LPINK = '#fbd3e0', CREAM = '#fff3df',
      MOUTH = '#b23a52', LILAC = '#cdaeee';

function mouthShape(m, x, y){
  if(m === 'a'){ cut(S([[x - 11, y - 4], [x, y - 7], [x + 11, y - 4], [x + 8, y + 8], [x, y + 11], [x - 8, y + 8]], 3), MOUTH, {sh: 0, jit: .8}); cut(E(x, y + 7, 5, 3, 8), '#f08aa0', {sh: 0, jit: .5, grain: 0}); }
  else if(m === 'o') cut(E(x, y + 2, 6, 7, 10), MOUTH, {sh: 0, jit: .7});
  else if(m === 'e'){ cut(S([[x - 13, y - 4], [x + 13, y - 4], [x + 9, y + 6], [x - 9, y + 6]], 3), MOUTH, {sh: 0, jit: .8}); cut(RR(x - 9, y - 4, 18, 4, 1), '#fff', {sh: 0, jit: .4, grain: 0}); }
  else if(m === 'wail'){ cut(S([[x - 13, y - 2], [x, y - 7], [x + 13, y - 2], [x + 15, y + 10], [x, y + 18], [x - 15, y + 10]], 3), MOUTH, {sh: 0, jit: .8}); cut(E(x, y + 12, 7, 4, 8), '#f08aa0', {sh: 0, jit: .5, grain: 0}); }
  else if(m === 'sad') ink(arc(x, y + 10, 10, 205, 335), 3.2, MOUTH);
  else if(m === 'flat') ink([[x - 7, y + 2], [x + 7, y + 2]], 3.2, MOUTH);
  else if(m === 'grin'){ cut(S([[x - 14, y - 5], [x + 14, y - 5], [x + 9, y + 9], [x, y + 12], [x - 9, y + 9]], 3), MOUTH, {sh: 0, jit: .8}); cut(RR(x - 10, y - 5, 20, 5, 1), '#fff', {sh: 0, jit: .4, grain: 0}); }
  else ink(arc(x, y - 4, 10, 25, 155), 3.2, MOUTH);
}
const FLAP = ['a', 'rest', 'o', 'e', 'a', 'rest', 'e', 'o'];
const lip = (talk, k) => talk ? FLAP[(hash(k | 0, 3, 11) * FLAP.length) | 0] : null;

// Sunshine. o: x, y (feet), face, s, walk (frame int or null), mouth, eyes, armL, armR, tilt, sway, tears, hold
function drawSunshine(o){
  seed(1);
  const wk = o.walk, step = wk != null ? [-24, 0, 24, 0][wk & 3] : 0, bob = wk != null ? [0, -6, 0, -6][wk & 3] : (o.bob || 0);
  const sway = (o.sway || 0) + (wk != null ? [5, 0, -5, 0][wk & 3] : 0);
  const arm = (sx, ang) => at(sx * 28, -178, -sx * ang, 1, 1, () => {
    cut(RR(-7, 0, 14, 62, 7), SKIN, {sh: .5});
    cut(E(0, 64, 9, 9, 10), SKIN, {sh: .3});
    if(sx > 0) for(let i = -1; i <= 1; i++) dot(i * 5, 52 - Math.abs(i), 2.6, '#ffffff');
    cut(E(0, 5, 17, 14), '#fffaf5', {sh: .5});
  });
  at(o.x, o.y, 0, (o.face || 1) * (o.s || 1), o.s || 1, () => {
    for(const [sx, ang] of [[-1, step], [1, -step]]) at(sx * 17, -80, ang, 1, 1, () => {
      cut(RR(-8, 0, 16, 66, 7), SKIN, {sh: .5});
      cut(RR(-9, 44, 18, 14, 4), '#ffffff', {sh: 0, jit: .8});
      cut(S([[-12, 62], [2, 56], [18, 62], [20, 74], [-12, 74]], 4), DPINK, {sh: .5});
    });
    at(0, bob, 0, 1, 1, () => {
      cut(S([[-30, -180], [30, -180], [58, -120], [86, -62], [42, -50], [0, -55], [-42, -50], [-86, -62], [-58, -120]], 5), '#fde3ec', {a: .92});
      arm(-1, o.armL ?? (wk != null ? -step * 1.1 : 8));
      cut(S([[-27, -190], [27, -190], [50, -125], [70, -76], [34, -66], [0, -71], [-34, -66], [-70, -76], [-50, -125]], 5), '#fffaf5');
      for(const [bx, by, r, c] of [[-24, -112, 8, '#f6a3bd'], [20, -96, 9, '#f6a3bd'], [-4, -142, 6, '#f9c2d2'], [40, -84, 6, '#f9c2d2'], [-44, -84, 7, '#f6a3bd'], [6, -84, 5, '#f9c2d2'], [28, -128, 5, '#f9c2d2']]){
        for(let i = 0; i < 5; i++){ const a = i * 1.2566 + bx; cut(E(bx + Math.cos(a) * r * .75, by + Math.sin(a) * r * .75, r * .6, r * .6, 7), c, {sh: 0, jit: .5, grain: .3}); }
        dot(bx, by, r * .32, '#ffe08a');
      }
      ink(So([[-62, -80], [-30, -70], [0, -75], [30, -70], [62, -80]], 4), 3, '#f6a3bd', {a: .9});
      cut(RR(-15, -198, 30, 13, 6), '#f7b7cb', {sh: .4});
      ink([[-3, -180], [8, -174]], 2.6, DPINK); dot(9, -173, 3, DPINK);
      if(o.heart !== false) cut(HEART(0, -150, 13), '#ffd98a', {sh: .3, jit: .6, a: .7 + .3 * Math.sin((o.t || 0) * 3)});
      arm(1, o.armR ?? (wk != null ? step * 1.1 : 8));
      // head

function wrapText(t, n){

  if(s) (s.length <= 2 && out.length ? out[out.length - 1] += s : out.push(s));

function caption(t, hint){

    for(let i = 0; i < s.length - 1; i++) if(P.includes(s[i]) && !(P + '”').includes(s[i + 1]) && (best < 0 || Math.abs(i + 1 - mid) < Math.abs(best - mid))) best = i + 1;

    F.lit[i] = 1; F.hide[i] = 0; fx('fx_chime'); huhuBack(); G.sun.pose = {eyes: 'happy', mouth: 'grin'};
    if(F.first){ F.first = false; await step(say('d_f2')); }
    if(F.lit.every(v => v >= 1)){
      F.all = G.t; fx('fx_chime2'); cheerStars(HT.tree, GY - 760); await step(wait(1500));
      F.hop = 1; await step(say('d_m4')); F.hop = 0; await step(say('d_m5'));
      await hilltop.hideRound();
    }
  },
  async hideRound(){
    const F = G.flags.h;
    G.sun.pose = {eyes: 'closed', mouth: 'grin', armL: 165, armR: 165}; G.fadeTo = .82; await step(say('d_count'));
    F.hid = [1, 0][F.round % 2]; F.seek = true; G.fadeTo = 0; G.sun.pose = {}; await step(wait(400)); hint('t_seek');
  },
  async bush(i){
    const F = G.flags.h;
    for(let k = 0; k < 6; k++) part('leaf', HT.bushes[i] + (k - 3) * 30, GY - 120, {vx: (k - 3) * 40, vy: -120, g: 160, life: 1.1});
    fx('fx_bump', .5);
    if(i !== F.hid){ await step(say('d_no')); return; }
    F.seek = false; F.hid = null; F.sheepX = HT.bushes[i] + 190; F.hop = 1; fx('fx_chime'); caption('');
    G.sun.pose = {eyes: 'happy', mouth: 'grin'}; await step(say('d_found')); F.hop = 0; F.round++;
    if(F.round < 2){ await step(say('d_again')); await hilltop.hideRound(); return; }
    await hilltop.dawn();
  },
  async dawn(){
    const F = G.flags.h;
    await step(say('d_m6')); G.sun.pose = {};
    say('d_dawn1'); await tween(5200, u => { F.dawn = ease(u); });
    await step(say('d_m7'));
    G.sun.pose = {eyes: 'teary', mouth: 'a', armL: 110, armR: 110}; await step(say('d_s2'));
    G.sun.pose = {eyes: 'cry', mouth: 'wail', tears: true, armL: 150, armR: 150}; G.hu.f = 1; G.hu.fdir = -60; fx('fx_big');
    await step(say('d_dawn2')); await tearPuff();
    G.sun.pose = {eyes: 'closed', mouth: 'o'}; await step(say('p_breath'));
    await step(breathTask(3, left => { G.hu.f = .08 + .9 * left / 3; part('puff', G.hu.x, G.hu.y - 110, {vy: -42, life: 3, wob: 10}); G.sun.pose = left ? {eyes: 'closed', mouth: 'o'} : {eyes: 'happy', mouth: 'rest'}; }));
    G.hu.f = .06; G.hu.fdir = 0; fx('fx_chime2'); await step(wait(700));
    F.gift = true; fx('fx_chime'); await step(say('d_gift')); await step(say('d_m8'));
    await step(walkTo(F.sheepX - 190)); G.sun.face = 1; G.sun.pose = {eyes: 'happy', mouth: 'rest', armR: 95};
    for(let k = 0; k < 4; k++) part('heart', F.sheepX - 110 + k * 30, GY - 300, {vy: -60 - k * 10, life: 2.4, col: k % 2 ? DPINK : '#f6a3bd'});
    await step(say('d_s3')); F.hop = 1; await step(say('d_m9')); F.hop = 0; G.sun.pose = {armR: 150};
    await tween(3200, u => { F.up = u; }); F.gone = true; G.sun.pose = {};
    await step(say('d_home')); F.leave = true; G.hu.f = 0;
  },
  async leave(){ await step(say('d_b1')); goScene('home'); },
};

// =============================================================== 5. flying home at sunrise
SC.home = {w: W, fixedCam: true, walk: false,
  init(){ G.sun.hidden = true; G.hu.hidden = true; G.flags.e = {t0: G.t}; },
  draw(cam, t){
    const u = t - G.flags.e.t0, bx = 420 + 22 * u, by = 700 - 6 * u + 6 * Math.sin(t * 1.6);
    seed(100); skyStrips(['#f6b4cb', '#fbc0b0', '#ffd9a8', '#fff0c8']);
    sunPaper(1360, 780, 170, t, '#ffcf4a');
    cloudPaper(400, 280, 1.5, '#fff1f4'); cloudPaper(1640, 230, 1.1, '#fff1f4');
    mountain(260, 990, 430, 280, '#c9a2cf'); mountain(900, 990, 400, 220, '#c9a2cf'); mountain(1760, 990, 400, 250, '#c9a2cf');
    hill(0, 0, x => 900 + 14 * Math.sin(x * .006), '#8fbf9a', {pat: 'dots'}); hill(0, 0, x => 980 + 10 * Math.sin(x * .01), '#6da98a');
    seed(170); balloonPaper(bx, by, .8, {f: .2, rot: 2 * Math.sin(t * 1.3), eyes: 'happy', mouth: G.talking === 'S' ? lip(true, Math.floor(t * 9)) || 'rest' : 'rest'});
    G.actors.S = {x: bx - 20, y: by - 170, screen: true}; G.actors.H = {x: bx + 50, y: by - 140, screen: true};
  },
  async enter(){ await step(say('e_0')); await step(say('e_1')); await step(say('e_2')); await step(wait(900)); goScene('bed'); },
};

// =============================================================== 6. bedtime
SC.bed = {w: W, fixedCam: true, walk: false,
  init(){ G.sun.hidden = true; G.hu.hidden = true; G.flags.b = {lit: 0, sleep: false, inset: 0}; },
  draw(cam, t){
    const F = G.flags.b;
    seed(100); bedroom(F.lit, t, F.sleep, G.talking === 'S', Math.floor(t * 9));
    seed(500); drawHuhu({x: 960, y: 632, s: .85, face: -1, eye: F.sleep ? 'squint' : 'open', wing: 0, f: G.task ? G.fire.f * .5 : 0});
    if(F.inset > 0){ seed(600); at(1465, 310, 0, ease(F.inset), null, () => {
      cut(E(0, 0, 250, 250, 40), '#fffaf0', {sh: 1.4}); cut(E(0, 0, 228, 228, 40), '#27336b', {sh: 0});
      cloudPaper(0, 90, 1.7, '#eef0fb'); drawSheep({x: -50, y: 80, s: .95, eyes: 'closed'}); starFruit(120, 10, 30, 1, t, 2); }); }
  },
  async enter(){
    const F = G.flags.b;
    await step(say('f_1')); hint('t_bed');
    await step(fireTask({kind: 'hold', zone: [.06, .3], need: .9, over: .55, noHu: true, onOver: T => { T.pause = .8; nag(); }, tick: p => { F.lit = .4 * p; }}));
    await tween(900, u => { F.lit = lerp(.4, 1, u); }); fx('fx_chime'); await step(say('f_2'));
    fx('fx_chime'); await tween(900, u => { F.inset = u; }); await step(say('f_3'));
    F.sleep = true; await step(wait(600)); part('spark', 900, 600, {vy: -50, vx: -14, life: 3.4, wob: 12, world: false});
    await step(say('f_4')); await step(wait(1400));
    G.mode = 'end'; caption(''); $('cover').hidden = false; $('b-start').textContent = '再玩一次'; $('how').textContent = '晚安，Sunshine'; voice('v_night');
  },
};
const ORDER = ['garden', 'meadow', 'flight', 'hilltop', 'home', 'bed'];

// ---------------------------------------------------------------- boot
fit(); G.scene = SC.title; G.fade = 0; G.fadeTo = 0; requestAnimationFrame(frame);
$('b-start').onclick = async () => {
  const first = !G.started;
  if(first) unlock();
  $('cover').hidden = true; $('bar').hidden = false; $('how').textContent = '点地面走路，点星星说话和玩';
  if(first){ await voice('v_title'); G.started = true; }
  goScene('garden');
};
$('b-pause').onclick = () => {
  G.paused = !G.paused; $('b-pause').setAttribute('aria-pressed', G.paused); $('b-pause').textContent = G.paused ? '▶' : 'Ⅱ';
  if(G.paused){ voiceEl.pause(); musicEl.pause(); }
  else { if(voiceDone && voiceEl.currentTime > 0 && !voiceEl.ended) tryPlay(voiceEl); if(musicOn) tryPlay(musicEl); }
};
$('b-skip').onclick = () => stopVoice();
$('b-next').onclick = () => { const i = ORDER.indexOf(Object.keys(SC).find(k => SC[k] === G.scene)); if(i < ORDER.length - 1) goScene(ORDER[i + 1]); };
$('b-music').onclick = () => { musicOn = !musicOn; $('b-music').setAttribute('aria-pressed', !musicOn); if(musicOn) tryPlay(musicEl); else musicEl.pause(); };
document.addEventListener('visibilitychange', () => { if(document.hidden && !G.paused) $('b-pause').onclick(); });
window.__g = {G, SC, goScene, garden, meadow, hilltop};
</script>
</body></html>
